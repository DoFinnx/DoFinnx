# Render Blueprint: сервер присутствия для Synchronization.
# Положите этот файл в корень репозитория рядом с папкой server/,
# затем на render.com: New → Blueprint → выберите репозиторий.
services:
  - type: web
    name: nocturne-sync
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
